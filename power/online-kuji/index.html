<!DOCTYPE html>
<html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>MONSTAGE ONLINE KUJI</title>
<style>
:root{--red:#f20b13;--black:#050505;--line:#282828;--muted:#777}*{box-sizing:border-box}html,body{margin:0;background:#000;color:#fff;font-family:Arial,"Helvetica Neue","Noto Sans JP",sans-serif}body{min-height:100svh}button{font:inherit}.app{width:min(100%,560px);min-height:100svh;margin:auto;background:linear-gradient(180deg,#080808,#000);overflow:hidden}.screen{display:none;min-height:100svh;padding:30px 22px 34px}.screen.active{display:flex;flex-direction:column}.brand{text-align:center;border-bottom:1px solid var(--line);padding:6px 0 20px}.eyebrow{font-size:9px;letter-spacing:.5em;color:#999;margin-left:.5em}.brand h1,.mini-title,.result-brand{font-size:clamp(43px,13vw,68px);font-weight:900;letter-spacing:-.075em;line-height:.9;margin:9px 0 0}.brand h1 span,.mini-title span,.result-brand span{color:var(--red)}.submark{margin-top:11px;font-size:12px;letter-spacing:.42em;margin-left:.42em}.submark b{color:var(--red)}.kuji-title{margin:22px 0 0;font-size:13px;letter-spacing:.34em;font-weight:700}.kuji-title:after{content:"";display:block;width:38px;height:3px;background:var(--red);margin:12px auto 0}.thanks{text-align:center;font-size:11px;letter-spacing:.08em;line-height:1.8;color:#777;margin:16px 0}.label{text-align:left;font-size:10px;letter-spacing:.28em;color:#aaa;margin:4px 0 10px}.members{display:grid;grid-template-columns:1fr 1fr;gap:7px;width:100%}.member{position:relative;border:1px solid var(--line);background:#090909;color:#fff;padding:12px 11px;text-align:left;min-height:58px}.member:nth-child(7){grid-column:1/-1}.member.selected{border-color:var(--red);background:#110405}.member .num{display:inline-block;width:20px;color:var(--red);font-size:10px;font-weight:800;vertical-align:3px}.member .name{font-size:18px;font-weight:800;letter-spacing:-.03em}.remain{display:block;margin:4px 0 0 20px;font-size:9px;letter-spacing:.08em;color:#666}.member:disabled{opacity:.35}.member:disabled:after{content:"SOLD OUT";position:absolute;right:9px;top:9px;font-size:8px;letter-spacing:.12em;color:var(--red)}.primary{width:100%;margin:16px 0 0;border:0;background:var(--red);color:#fff;padding:15px;font-size:13px;font-weight:800;letter-spacing:.28em}.primary:disabled{background:#202020;color:#555}.note{text-align:center;color:#555;font-size:9px;letter-spacing:.08em;margin:9px 0 0}#drawScreen{justify-content:center;align-items:center}.top-mini{text-align:center;margin-bottom:12px}.mini-title{font-size:40px}.mini-sub{font-size:9px;letter-spacing:.4em;margin-top:9px}.selected-member{font-size:10px;letter-spacing:.18em;color:#777;margin:7px 0 17px}.selected-member b{color:#fff}.ticket-wrap{width:min(80vw,380px);aspect-ratio:9/14;perspective:1000px}.ticket{width:100%;height:100%;position:relative;transform-style:preserve-3d;transition:.75s;cursor:pointer}.ticket.flipped{transform:rotateY(180deg)}.face{position:absolute;inset:0;backface-visibility:hidden;background:#070707;border:1px solid #333}.face:before{content:"";position:absolute;inset:13px;border:1px solid var(--red)}.corner{position:absolute;right:0;bottom:0;width:90px;height:90px;background:var(--red);clip-path:polygon(100% 0,100% 100%,0 100%)}.corner span{position:absolute;right:4px;bottom:20px;transform:rotate(-45deg);font-size:12px;font-weight:800;letter-spacing:.18em}.ticket-logo{position:relative;z-index:2;text-align:center;margin-top:40%}.ticket-logo .big{font-size:37px;font-weight:900;letter-spacing:-.06em}.ticket-logo .big span{color:var(--red)}.ticket-logo .small{font-size:10px;letter-spacing:.34em;margin-top:12px}.open-hint{position:absolute;left:0;right:0;bottom:20%;text-align:center;color:#555;font-size:9px;letter-spacing:.3em}.back{transform:rotateY(180deg);display:grid;place-items:center}.back .tap{position:relative;z-index:2;text-align:center}.back strong{display:block;color:var(--red);font-size:35px;letter-spacing:.08em}.back span{font-size:9px;letter-spacing:.2em;color:#777}.draw-note{font-size:9px;letter-spacing:.14em;color:#666;margin-top:15px}#resultScreen{align-items:center;justify-content:center}.result-card{width:100%;max-width:460px;border:1px solid #292929;background:#070707;padding:25px 20px}.result-brand{text-align:center;font-size:42px}.result-sub{text-align:center;font-size:9px;letter-spacing:.4em;margin-top:9px}.redline{width:38px;height:3px;background:var(--red);margin:15px auto 24px}.prize-grade{text-align:center;font-size:48px;font-weight:900;letter-spacing:-.06em}.prize-name{text-align:center;color:#fff;font-size:13px;font-weight:700;letter-spacing:.05em;min-height:36px;margin:5px 0 17px}.photo-placeholder{width:78%;aspect-ratio:1;margin:auto;background:#fff;border:1px solid #555;box-shadow:0 0 0 7px #0c0c0c,0 0 0 8px var(--red);display:grid;place-items:center;color:#ddd;font-size:9px;letter-spacing:.15em}.member-result{text-align:center;margin-top:19px;font-size:10px;letter-spacing:.2em;color:#777}.member-result b{color:#fff}.again button{width:100%;margin-top:17px;border:0;background:var(--red);color:#fff;padding:14px;font-size:11px;font-weight:800;letter-spacing:.25em}.stockline{text-align:center;color:#555;font-size:9px;letter-spacing:.08em;margin-top:10px}@media(max-height:740px){.screen{padding-top:18px}.brand{padding-bottom:12px}.brand h1{font-size:43px}.kuji-title{margin-top:13px}.thanks{margin:9px 0}.member{min-height:52px;padding:9px}.primary{margin-top:11px}}
</style></head><body><div class="app">
<section class="screen active" id="homeScreen"><div class="brand"><div class="eyebrow">MONSTAGE PRESENTS</div><h1>MONST<span>A</span>GE</h1><div class="submark">OFFICIAL FAN EVENT</div><div class="kuji-title">ONLINE KUJI / オンラインくじ</div></div><div class="thanks">MONSTAGEをご登録いただきありがとうございます</div><div class="label">SELECT YOUR MEMBER / 推しを選択</div><div class="members" id="memberList"></div><button class="primary" id="drawBtn" disabled>DRAW A TICKET / くじを引く</button><p class="note">各メンバー 景品がなくなり次第終了</p></section>
<section class="screen" id="drawScreen"><div class="top-mini"><div class="mini-title">MONST<span>A</span>GE</div><div class="mini-sub">ONLINE KUJI</div></div><div class="selected-member">SELECTED / <b id="drawMember"></b></div><div class="ticket-wrap"><div class="ticket" id="ticket"><div class="face front"><div class="ticket-logo"><div class="big">MONST<span>A</span>GE</div><div class="small">ONLINE KUJI</div></div><div class="open-hint">TAP TO OPEN</div><div class="corner"><span>OPEN</span></div></div><div class="face back"><div class="tap"><strong>OPEN</strong><span>RESULT</span></div></div></div></div><div class="draw-note">カードをタップしてめくってください</div></section>
<section class="screen" id="resultScreen"><div class="result-card"><div class="result-brand">MONST<span>A</span>GE</div><div class="result-sub">ONLINE KUJI</div><div class="redline"></div><div class="prize-grade" id="grade">A賞</div><div class="prize-name" id="prizeName"></div><div class="photo-placeholder">PRIZE IMAGE</div><div class="member-result">MEMBER / <b id="resultMember"></b></div><div class="again"><button id="homeBtn">BACK TO TOP / トップへ戻る</button></div><div class="stockline" id="stockLine"></div></div></section></div>
<script>
const MEMBERS=["RUKA","PHARITA","ASA","AHYEON","RAMI","RORA","CHIQUITA"];const PRIZES=[{grade:"A賞",name:"MONSTAGEオリジナルミニトレカ",count:1},{grade:"B賞",name:"IDフォトチャーム",count:5},{grade:"C賞",name:"メンバーステッカー",count:2},{grade:"D賞",name:"全メンバーステッカー",count:4}];const KEY="monstage_online_kuji_v1";let selected=null,pendingResult=null,locked=false;function initialStocks(){const o={};MEMBERS.forEach(m=>o[m]=Object.fromEntries(PRIZES.map(p=>[p.grade,p.count])));return o}function loadStocks(){try{const s=JSON.parse(localStorage.getItem(KEY));if(s&&MEMBERS.every(m=>s[m]))return s}catch(e){}const s=initialStocks();localStorage.setItem(KEY,JSON.stringify(s));return s}function saveStocks(s){localStorage.setItem(KEY,JSON.stringify(s))}function remainingFor(m,s=loadStocks()){return Object.values(s[m]).reduce((a,b)=>a+b,0)}function show(id){document.querySelectorAll('.screen').forEach(x=>x.classList.remove('active'));document.getElementById(id).classList.add('active');window.scrollTo(0,0)}function renderMembers(){const s=loadStocks(),list=document.getElementById('memberList');list.innerHTML='';MEMBERS.forEach((m,i)=>{const left=remainingFor(m,s),b=document.createElement('button');b.className='member'+(selected===m?' selected':'');b.disabled=left===0;b.innerHTML=`<span class="num">0${i+1}</span><span class="name">${m}</span><span class="remain">${left===0?'景品終了':'REMAINING '+left+' / 残り '+left+'枚'}</span>`;b.onclick=()=>{selected=m;renderMembers();document.getElementById('drawBtn').disabled=false};list.appendChild(b)});if(selected&&remainingFor(selected,s)===0){selected=null;document.getElementById('drawBtn').disabled=true}}function drawPrize(m){const s=loadStocks(),bag=[];PRIZES.forEach(p=>{for(let i=0;i<(s[m][p.grade]||0);i++)bag.push(p)});if(!bag.length)return null;const p=bag[Math.floor(Math.random()*bag.length)];s[m][p.grade]--;saveStocks(s);return p}document.getElementById('drawBtn').onclick=()=>{if(!selected)return;pendingResult=null;locked=false;document.getElementById('drawMember').textContent=selected;document.getElementById('ticket').classList.remove('flipped');show('drawScreen')};document.getElementById('ticket').onclick=()=>{if(locked)return;locked=true;pendingResult=drawPrize(selected);if(!pendingResult){show('homeScreen');renderMembers();return}document.getElementById('ticket').classList.add('flipped');setTimeout(()=>{grade.textContent=pendingResult.grade;prizeName.textContent=pendingResult.name;resultMember.textContent=selected;stockLine.textContent=`${selected} / 残り景品 ${remainingFor(selected)}枚`;show('resultScreen')},800)};document.getElementById('homeBtn').onclick=()=>{selected=null;drawBtn.disabled=true;renderMembers();show('homeScreen')};renderMembers();
</script></body></html>
