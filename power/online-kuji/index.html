<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<title>MONSTAGE オンラインくじ</title>
<style>
  :root{--bg:#050505;--red:#ff1717;--text:#fff}
  *{box-sizing:border-box}html,body{margin:0;background:#000;color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Noto Sans JP","Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif}body{min-height:100svh}button{font:inherit}.app{width:min(100%,560px);min-height:100svh;margin:auto;background:radial-gradient(circle at 50% 0%,rgba(255,23,23,.10),transparent 32%),linear-gradient(180deg,#080808,#000 58%);position:relative;overflow:hidden}.screen{display:none;min-height:100svh;padding:24px 20px 34px}.screen.active{display:flex;flex-direction:column}.brand{padding-top:8px;text-align:center}.emblem{width:116px;height:104px;margin:0 auto 8px;position:relative;display:grid;place-items:center}.hex{position:absolute;inset:0;clip-path:polygon(50% 0,94% 25%,94% 75%,50% 100%,6% 75%,6% 25%);background:linear-gradient(145deg,#fff 0%,#777 36%,#151515 50%,#ff1717 80%,#fff 100%)}.hex::after{content:"";position:absolute;inset:3px;clip-path:inherit;background:#050505}.m{position:relative;z-index:2;font-family:Georgia,serif;font-weight:700;font-size:63px;line-height:1;background:linear-gradient(#fff,#777);-webkit-background-clip:text;color:transparent}.wordmark{font-size:13px;letter-spacing:.48em;color:#eee;margin-left:.48em}.wordmark b{color:var(--red)}h1{margin:16px 0 0;text-align:center;font-size:clamp(38px,11vw,64px);line-height:.95;font-weight:950;letter-spacing:-.03em;color:var(--red)}.pill{margin:18px auto 0;background:var(--red);border-radius:14px;padding:12px 28px;font-size:clamp(25px,7vw,34px);font-weight:900;line-height:1.1}.thanks{text-align:center;color:#ff4b4b;margin:18px 0 16px;font-size:14px;line-height:1.55}.label{align-self:center;background:var(--red);padding:7px 16px;margin:0 0 14px;font-size:14px}.members{display:grid;grid-template-columns:1fr 1fr;gap:10px;max-width:450px;width:100%;margin:auto}.member{position:relative;border:1px solid #333;background:#0c0c0c;color:#fff;border-radius:10px;padding:14px 12px;text-align:left;min-height:67px;transition:.2s}.member:nth-child(7){grid-column:1/-1}.member:not(:disabled):active,.member.selected{border-color:var(--red);background:#170606;box-shadow:0 0 0 1px var(--red),0 0 24px rgba(255,0,0,.16)}.member .num{color:var(--red);font-weight:900;margin-right:6px}.member .name{font-family:Georgia,serif;font-size:21px}.remain{display:block;color:#969696;font-size:11px;margin-top:5px}.member:disabled{opacity:.46;background:#121212;color:#777;cursor:not-allowed}.member:disabled::after{content:"SOLD OUT";position:absolute;right:8px;top:8px;color:#fff;background:#4c4c4c;font-size:9px;font-weight:800;padding:4px 6px;border-radius:4px;letter-spacing:.08em}.primary{margin:22px auto 0;width:min(86%,420px);border:0;border-radius:8px;padding:16px 18px;background:var(--red);color:#fff;font-size:24px;font-weight:900;box-shadow:0 8px 26px rgba(255,0,0,.16)}.primary:disabled{background:#383838;color:#818181;box-shadow:none}.note{font-size:10px;text-align:center;color:#666;margin:9px 0 0}#drawScreen{justify-content:center;align-items:center;gap:22px}.top-mini{text-align:center}.top-mini .mini-title{font-weight:950;color:var(--red);font-size:34px}.top-mini .mini-pill{display:inline-block;margin-top:6px;background:var(--red);padding:8px 20px;border-radius:9px;font-weight:800}.selected-member{font-size:13px;color:#aaa;text-align:center}.selected-member b{color:#fff}.ticket-wrap{width:min(84vw,400px);aspect-ratio:9/15;perspective:1000px}.ticket{width:100%;height:100%;position:relative;transform-style:preserve-3d;transition:transform .8s cubic-bezier(.2,.7,.2,1);cursor:pointer}.ticket.flipped{transform:rotateY(180deg)}.face{position:absolute;inset:0;backface-visibility:hidden;border:3px solid var(--red);background:#090909;padding:16px;box-shadow:0 16px 55px rgba(255,0,0,.15)}.face::before{content:"";position:absolute;inset:15px;border:1px solid #4b4b4b;pointer-events:none}.corner{position:absolute;right:-3px;bottom:-3px;width:95px;height:95px;background:var(--red);clip-path:polygon(100% 0,100% 100%,0 100%)}.corner span{position:absolute;right:6px;bottom:23px;transform:rotate(-45deg);font-size:18px;font-weight:900;letter-spacing:.1em}.ticket-logo{position:relative;z-index:2;text-align:center;margin-top:28%}.ticket-logo .big{font-size:46px;font-weight:950;color:var(--red)}.ticket-logo .small{display:inline-block;background:var(--red);padding:7px 16px;border-radius:8px;font-size:20px;font-weight:800}.open-hint{position:absolute;left:0;right:0;bottom:24%;text-align:center;color:#aaa;font-size:12px;letter-spacing:.12em}.back{transform:rotateY(180deg);display:grid;place-items:center;text-align:center}.back .tap{position:relative;z-index:2}.back .tap strong{display:block;font-size:32px;color:var(--red);margin-bottom:6px}.back .tap span{color:#bbb}#resultScreen{align-items:center}.result-card{width:100%;max-width:470px;margin:auto;border:2px solid var(--red);background:#070707;padding:24px 18px 30px;box-shadow:0 18px 60px rgba(255,0,0,.12)}.result-brand{text-align:center;font-size:38px;color:var(--red);font-weight:950;line-height:1}.result-pill{display:block;width:max-content;margin:10px auto 26px;background:var(--red);padding:8px 22px;border-radius:8px;font-weight:900}.prize-grade{text-align:center;font-size:44px;font-weight:950;margin:0;color:#fff}.prize-name{text-align:center;color:#ff4a4a;font-size:15px;font-weight:800;min-height:42px;margin:6px 0 18px}.photo-placeholder{width:82%;aspect-ratio:1/1;margin:auto;background:#fff;border:8px solid var(--red);display:grid;place-items:center;color:#d3d3d3;font-size:13px;letter-spacing:.08em}.member-result{text-align:center;margin:16px 0 2px;font-size:15px;color:#aaa}.member-result b{color:#fff}.again{margin-top:16px;display:flex;gap:10px}.again button{flex:1;border-radius:8px;padding:13px;border:1px solid #444;background:#111;color:#fff;font-weight:800}.again .home{background:var(--red);border-color:var(--red)}.stockline{font-size:10px;color:#666;text-align:center;margin-top:10px}@media(max-height:700px){.screen{padding-top:12px}.emblem{width:80px;height:72px}.m{font-size:43px}.wordmark{font-size:10px}h1{margin-top:8px}.pill{margin-top:10px}.thanks{margin:10px 0}.member{min-height:58px;padding:10px}}
</style>
</head>
<body>
<div class="app">
<section class="screen active" id="homeScreen"><div class="brand"><div class="emblem"><div class="hex"></div><div class="m">M</div></div><div class="wordmark">MONST<b>A</b>GE</div><h1>MONSTAGE</h1><div class="pill">オンラインくじ</div></div><div class="thanks">MONSTAGEをご登録いただき<br>ありがとうございます</div><div class="label">推しを選択してください</div><div class="members" id="memberList"></div><button class="primary" id="drawBtn" disabled>くじを引く</button><p class="note">各メンバー 景品がなくなり次第終了</p></section>
<section class="screen" id="drawScreen"><div class="top-mini"><div class="mini-title">MONSTAGE</div><div class="mini-pill">オンラインくじ</div></div><div class="selected-member">選択メンバー：<b id="drawMember"></b></div><div class="ticket-wrap"><div class="ticket" id="ticket"><div class="face front"><div class="ticket-logo"><div class="big">MONSTAGE</div><div class="small">オンラインくじ</div></div><div class="open-hint">TAP TO OPEN</div><div class="corner"><span>OPEN</span></div></div><div class="face back"><div class="tap"><strong>OPEN!</strong><span>結果を表示します</span></div></div></div></div><div style="font-size:12px;color:#777;text-align:center">カードをタップしてめくってね</div></section>
<section class="screen" id="resultScreen"><div class="result-card"><div class="result-brand">MONSTAGE</div><div class="result-pill">オンラインくじ</div><div class="prize-grade" id="grade">A賞</div><div class="prize-name" id="prizeName"></div><div class="photo-placeholder">景品写真スペース</div><div class="member-result">メンバー：<b id="resultMember"></b></div><div class="again"><button class="home" id="homeBtn">トップへ戻る</button></div><div class="stockline" id="stockLine"></div></div></section>
</div>
<script>
const MEMBERS=["RUKA","PHARITA","ASA","AHYEON","RAMI","RORA","CHIQUITA"];
const PRIZES=[{grade:"A賞",name:"MONSTAGEオリジナルミニトレカ",count:1},{grade:"B賞",name:"IDフォトチャーム",count:5},{grade:"C賞",name:"メンバーステッカー",count:2},{grade:"D賞",name:"全メンバーステッカー",count:4}];
const KEY="monstage_online_kuji_v1";let selected=null,pendingResult=null,locked=false;
function initialStocks(){const out={};MEMBERS.forEach(m=>out[m]=Object.fromEntries(PRIZES.map(p=>[p.grade,p.count])));return out}
function loadStocks(){try{const saved=JSON.parse(localStorage.getItem(KEY));if(saved&&MEMBERS.every(m=>saved[m]))return saved}catch(e){}const s=initialStocks();localStorage.setItem(KEY,JSON.stringify(s));return s}
function saveStocks(s){localStorage.setItem(KEY,JSON.stringify(s))}function remainingFor(m,s=loadStocks()){return Object.values(s[m]).reduce((a,b)=>a+b,0)}
function show(id){document.querySelectorAll(".screen").forEach(x=>x.classList.remove("active"));document.getElementById(id).classList.add("active");window.scrollTo({top:0,behavior:"instant"})}
function renderMembers(){const stocks=loadStocks(),list=document.getElementById("memberList");list.innerHTML="";MEMBERS.forEach((m,i)=>{const left=remainingFor(m,stocks),b=document.createElement("button");b.className="member"+(selected===m?" selected":"");b.disabled=left===0;b.innerHTML=`<span class="num">${i+1}.</span><span class="name">${m}</span><span class="remain">${left===0?"景品終了":"残り "+left+" 枚"}</span>`;b.onclick=()=>{selected=m;renderMembers();document.getElementById("drawBtn").disabled=false};list.appendChild(b)});if(selected&&remainingFor(selected,stocks)===0){selected=null;document.getElementById("drawBtn").disabled=true}}
function drawPrize(member){const stocks=loadStocks(),bag=[];PRIZES.forEach(p=>{for(let i=0;i<(stocks[member][p.grade]||0);i++)bag.push(p)});if(!bag.length)return null;const p=bag[Math.floor(Math.random()*bag.length)];stocks[member][p.grade]--;saveStocks(stocks);return p}
document.getElementById("drawBtn").onclick=()=>{if(!selected)return;if(remainingFor(selected)===0){renderMembers();return}pendingResult=null;locked=false;document.getElementById("drawMember").textContent=selected;document.getElementById("ticket").classList.remove("flipped");show("drawScreen")};
document.getElementById("ticket").onclick=()=>{if(locked)return;locked=true;pendingResult=drawPrize(selected);if(!pendingResult){show("homeScreen");renderMembers();return}document.getElementById("ticket").classList.add("flipped");setTimeout(()=>{document.getElementById("grade").textContent=pendingResult.grade;document.getElementById("prizeName").textContent=pendingResult.name;document.getElementById("resultMember").textContent=selected;document.getElementById("stockLine").textContent=`${selected} の残り景品：${remainingFor(selected)}枚`;show("resultScreen")},850)};
document.getElementById("homeBtn").onclick=()=>{selected=null;document.getElementById("drawBtn").disabled=true;renderMembers();show("homeScreen")};renderMembers();
</script>
</body>
</html>
