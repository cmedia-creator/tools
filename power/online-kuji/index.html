<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>MONSTAGE ONLINE KUJI</title>
<style>
:root{--red:#f20b13;--line:#282828}
*{box-sizing:border-box}html,body{margin:0;background:#000;color:#fff;font-family:Arial,"Helvetica Neue","Noto Sans JP",sans-serif}body{min-height:100svh}button{font:inherit}
.app{width:min(100%,560px);min-height:100svh;margin:auto;background:linear-gradient(#080808,#000);overflow:hidden}
.screen{display:none;min-height:100svh;padding:28px 22px 34px}.screen.active{display:flex;flex-direction:column}
.brand{text-align:center;border-bottom:1px solid var(--line);padding:4px 0 18px}.eyebrow{font-size:9px;letter-spacing:.5em;color:#999;margin-left:.5em}
.brand h1,.mini-title,.result-brand{font-size:clamp(43px,13vw,68px);font-weight:900;letter-spacing:-.075em;line-height:.9;margin:9px 0 0}
.brand h1 span,.mini-title span,.result-brand span{color:var(--red)}.submark{margin-top:11px;font-size:11px;letter-spacing:.42em}
.kuji-title{margin:19px 0 0;font-size:12px;letter-spacing:.3em;font-weight:700}.kuji-title:after{content:"";display:block;width:38px;height:3px;background:var(--red);margin:11px auto 0}
.thanks{text-align:center;font-size:10px;letter-spacing:.08em;color:#777;margin:14px 0}.label{font-size:10px;letter-spacing:.24em;color:#aaa;margin:3px 0 10px}
.members{display:grid;grid-template-columns:1fr 1fr;gap:7px;width:100%}.member{position:relative;border:1px solid var(--line);background:#090909;color:#fff;padding:12px 11px;text-align:left;min-height:58px}
.member:nth-child(7){grid-column:1/-1}.member.selected{border-color:var(--red);background:#110405}.num{display:inline-block;width:22px;color:var(--red);font-size:10px;font-weight:800;vertical-align:3px}
.name{font-size:18px;font-weight:800}.remain{display:block;margin:4px 0 0 22px;font-size:9px;color:#666}.member:disabled{opacity:.35}.member:disabled:after{content:"SOLD OUT";position:absolute;right:9px;top:9px;font-size:8px;color:var(--red)}
.primary{width:100%;margin:15px 0 0;border:0;background:var(--red);color:#fff;padding:15px;font-size:12px;font-weight:800;letter-spacing:.22em}.primary:disabled{background:#202020;color:#555}.note{text-align:center;color:#555;font-size:9px;margin:9px 0 0}
#drawScreen{justify-content:center;align-items:center}.top-mini{text-align:center;margin-bottom:12px}.mini-title{font-size:40px}.mini-sub{font-size:9px;letter-spacing:.4em;margin-top:9px}.selected-member{font-size:10px;letter-spacing:.18em;color:#777;margin:7px 0 17px}.selected-member b{color:#fff}
.ticket-wrap{width:min(80vw,380px);aspect-ratio:9/14;perspective:1000px}.ticket{width:100%;height:100%;position:relative;transform-style:preserve-3d;transition:.75s;cursor:pointer}.ticket.flipped{transform:rotateY(180deg)}.face{position:absolute;inset:0;backface-visibility:hidden;background:#070707;border:1px solid #333}.face:before{content:"";position:absolute;inset:13px;border:1px solid var(--red)}
.corner{position:absolute;right:0;bottom:0;width:90px;height:90px;background:var(--red);clip-path:polygon(100% 0,100% 100%,0 100%)}.corner span{position:absolute;right:4px;bottom:20px;transform:rotate(-45deg);font-size:12px;font-weight:800;letter-spacing:.18em}
.ticket-logo{position:relative;z-index:2;text-align:center;margin-top:40%}.ticket-logo .big{font-size:37px;font-weight:900;letter-spacing:-.06em}.ticket-logo .big span{color:var(--red)}.ticket-logo .small{font-size:10px;letter-spacing:.34em;margin-top:12px}.open-hint{position:absolute;left:0;right:0;bottom:20%;text-align:center;color:#555;font-size:9px;letter-spacing:.3em}.back{transform:rotateY(180deg);display:grid;place-items:center}.tap{position:relative;z-index:2;text-align:center}.tap strong{display:block;color:var(--red);font-size:35px}.tap span{font-size:9px;color:#777}
#resultScreen{align-items:center;justify-content:center}.result-card{width:100%;max-width:460px;border:1px solid #292929;background:#070707;padding:24px 20px}.result-brand{text-align:center;font-size:42px}.result-sub{text-align:center;font-size:9px;letter-spacing:.4em;margin-top:9px}.redline{width:38px;height:3px;background:var(--red);margin:15px auto 22px}.prize-grade{text-align:center;font-size:48px;font-weight:900}.prize-name{text-align:center;font-size:13px;font-weight:700;min-height:35px;margin:5px 0 17px}
.photo{width:78%;aspect-ratio:1;margin:auto;background:#fff;border:1px solid #555;box-shadow:0 0 0 7px #0c0c0c,0 0 0 8px var(--red);overflow:hidden}.photo img{width:100%;height:100%;object-fit:contain;display:block}.member-result{text-align:center;margin-top:18px;font-size:10px;letter-spacing:.2em;color:#777}.member-result b{color:#fff}.again button{width:100%;margin-top:17px;border:0;background:var(--red);color:#fff;padding:14px;font-size:11px;font-weight:800;letter-spacing:.2em}.stockline{text-align:center;color:#555;font-size:9px;margin-top:10px}
.admin-reset{margin:12px auto 0;border:0;background:transparent;color:#555;font-size:9px;letter-spacing:.12em;text-decoration:underline;text-underline-offset:3px;padding:10px 14px}.admin-reset:active{color:#aaa}
</style>
</head>
<body>
<div class="app">
<section id="homeScreen" class="screen active">
<div class="brand"><div class="eyebrow">MONSTAGE PRESENTS</div><h1>MONST<span>A</span>GE</h1><div class="submark">OFFICIAL FAN EVENT</div><div class="kuji-title">ONLINE KUJI / オンラインくじ</div></div>
<div class="thanks">MONSTAGEをご登録いただきありがとうございます</div>
<div class="label">SELECT YOUR MEMBER / 推しを選択</div>
<div id="memberList" class="members">
<button class="member" data-member="RUKA"><span class="num">01</span><span class="name">RUKA</span><span class="remain">REMAINING 12 / 残り 12枚</span></button>
<button class="member" data-member="PHARITA"><span class="num">02</span><span class="name">PHARITA</span><span class="remain">REMAINING 12 / 残り 12枚</span></button>
<button class="member" data-member="ASA"><span class="num">03</span><span class="name">ASA</span><span class="remain">REMAINING 12 / 残り 12枚</span></button>
<button class="member" data-member="AHYEON"><span class="num">04</span><span class="name">AHYEON</span><span class="remain">REMAINING 12 / 残り 12枚</span></button>
<button class="member" data-member="RAMI"><span class="num">05</span><span class="name">RAMI</span><span class="remain">REMAINING 12 / 残り 12枚</span></button>
<button class="member" data-member="RORA"><span class="num">06</span><span class="name">RORA</span><span class="remain">REMAINING 12 / 残り 12枚</span></button>
<button class="member" data-member="CHIQUITA"><span class="num">07</span><span class="name">CHIQUITA</span><span class="remain">REMAINING 12 / 残り 12枚</span></button>
</div>
<button id="drawBtn" class="primary" disabled>DRAW A TICKET / くじを引く</button>
<p class="note">各メンバー 景品がなくなり次第終了</p><button id="resetBtn" class="admin-reset" type="button">在庫をリセット</button>
</section>
<section id="drawScreen" class="screen"><div class="top-mini"><div class="mini-title">MONST<span>A</span>GE</div><div class="mini-sub">ONLINE KUJI</div></div><div class="selected-member">SELECTED / <b id="drawMember"></b></div><div class="ticket-wrap"><div id="ticket" class="ticket"><div class="face front"><div class="ticket-logo"><div class="big">MONST<span>A</span>GE</div><div class="small">ONLINE KUJI</div></div><div class="open-hint">TAP TO OPEN</div><div class="corner"><span>OPEN</span></div></div><div class="face back"><div class="tap"><strong>OPEN</strong><span>RESULT</span></div></div></div></div></section>
<section id="resultScreen" class="screen"><div class="result-card"><div class="result-brand">MONST<span>A</span>GE</div><div class="result-sub">ONLINE KUJI</div><div class="redline"></div><div id="grade" class="prize-grade"></div><div id="prizeName" class="prize-name"></div><div class="photo"><img id="prizePhoto" alt="景品写真"></div><div class="member-result">MEMBER / <b id="resultMember"></b></div><div class="again"><button id="homeBtn">BACK TO TOP / トップへ戻る</button></div><div id="stockLine" class="stockline"></div></div></section>
</div>
<script>
const PHOTOS={"A賞":"prize-a.jpg?v=20260914b","B賞":"prize-b.jpg?v=20260914b","C賞":"prize-c.jpg?v=20260914b","D賞":"prize-d.jpg?v=20260914b"};
const MEMBERS=["RUKA","PHARITA","ASA","AHYEON","RAMI","RORA","CHIQUITA"];
const PRIZES=[{grade:"A賞",name:"MONSTAGEオリジナルミニトレカ",count:1},{grade:"B賞",name:"IDフォトチャーム",count:5},{grade:"C賞",name:"メンバーステッカー",count:2},{grade:"D賞",name:"全メンバーステッカー",count:4}];
const KEY="monstage_online_kuji_v1";let selected=null,locked=false;
function initialStocks(){const o={};MEMBERS.forEach(m=>o[m]=Object.fromEntries(PRIZES.map(p=>[p.grade,p.count])));return o}
function loadStocks(){try{const s=JSON.parse(localStorage.getItem(KEY));if(s&&MEMBERS.every(m=>s[m]&&typeof s[m]==="object"))return s}catch(e){}const s=initialStocks();localStorage.setItem(KEY,JSON.stringify(s));return s}
function saveStocks(s){localStorage.setItem(KEY,JSON.stringify(s))}
function remaining(m,s=loadStocks()){return Object.values(s[m]).reduce((a,b)=>a+Number(b||0),0)}
function show(id){document.querySelectorAll(".screen").forEach(x=>x.classList.remove("active"));document.getElementById(id).classList.add("active");window.scrollTo(0,0)}
function renderMembers(){const s=loadStocks(),buttons=[...document.querySelectorAll(".member")];buttons.forEach((b,i)=>{const m=MEMBERS[i],left=remaining(m,s);b.disabled=left===0;b.classList.toggle("selected",selected===m);b.querySelector(".remain").textContent=left===0?"景品終了":"REMAINING "+left+" / 残り "+left+"枚";b.onclick=()=>{if(left===0)return;selected=m;renderMembers();document.getElementById("drawBtn").disabled=false}})}
function drawPrize(m){const s=loadStocks(),bag=[];PRIZES.forEach(p=>{for(let i=0;i<(s[m][p.grade]||0);i++)bag.push(p)});if(!bag.length)return null;const p=bag[Math.floor(Math.random()*bag.length)];s[m][p.grade]--;saveStocks(s);return p}
document.getElementById("drawBtn").onclick=()=>{if(!selected)return;locked=false;document.getElementById("drawMember").textContent=selected;document.getElementById("ticket").classList.remove("flipped");show("drawScreen")};
document.getElementById("ticket").onclick=()=>{if(locked)return;locked=true;const p=drawPrize(selected);if(!p){selected=null;renderMembers();show("homeScreen");return}document.getElementById("ticket").classList.add("flipped");setTimeout(()=>{document.getElementById("grade").textContent=p.grade;document.getElementById("prizeName").textContent=p.name;const img=document.getElementById("prizePhoto");img.onerror=()=>{img.alt="景品画像を読み込めませんでした"};img.src=PHOTOS[p.grade];document.getElementById("resultMember").textContent=selected;document.getElementById("stockLine").textContent=selected+" / 残り景品 "+remaining(selected)+"枚";show("resultScreen")},780)};
document.getElementById("homeBtn").onclick=()=>{selected=null;document.getElementById("drawBtn").disabled=true;renderMembers();show("homeScreen")};
document.getElementById("resetBtn").onclick=()=>{if(!confirm("全メンバーの在庫を初期状態（各12枚）に戻します。よろしいですか？"))return;saveStocks(initialStocks());selected=null;document.getElementById("drawBtn").disabled=true;renderMembers();alert("在庫を初期状態に戻しました")};
renderMembers();
</script>
</body></html>
